<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Predicciones de Estudiantes</title>
    <style>
        table { border-collapse: collapse; width: 50%; margin-bottom: 30px; }
        th, td { border: 1px solid #333; padding: 8px; text-align: center; }
        th { background-color: #eee; }
    </style>
</head>
<body>
    <h1>Predicciones - Student Mat</h1>
    <p><strong>Resumen:</strong> <span th:text="${matAprobados}"></span> aprobados de <span th:text="${matTotal}"></span> (umbral >= 10)</p>
    <table>
        <tr><th>#</th><th>Nota Real (G3)</th><th>Predicción</th><th>Nota Predicha</th></tr>
        <tr th:each="item : ${prediccionesMat}">
            <td th:text="${item['index']}"></td>
            <td th:text="${item['actual'] != null ? item['actual'] : '-'}"></td>
            <td th:text="${item['predictedLabel']}"></td>
            <td th:text="${item['predictedGrade'] != null ? #numbers.formatDecimal(item['predictedGrade'], 1, 'POINT') : '-'}"></td>
        </tr>
    </table>

    <h1>Predicciones - Student Por</h1>
    <p><strong>Resumen:</strong> <span th:text="${porAprobados}"></span> aprobados de <span th:text="${porTotal}"></span> (umbral >= 10)</p>
    <table>
        <tr><th>#</th><th>Nota Real (G3)</th><th>Predicción</th><th>Nota Predicha</th></tr>
        <tr th:each="item : ${prediccionesPor}">
            <td th:text="${item['index']}"></td>
            <td th:text="${item['actual'] != null ? item['actual'] : '-'}"></td>
            <td th:text="${item['predictedLabel']}"></td>
            <td th:text="${item['predictedGrade'] != null ? #numbers.formatDecimal(item['predictedGrade'], 1, 'POINT') : '-'}"></td>
        </tr>
    </table>
</body>
</html>
